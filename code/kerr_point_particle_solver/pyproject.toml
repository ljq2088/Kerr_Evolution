[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sminus2-point-particle"
version = "0.1.0"
description = "Owner-accepted fixed-m Kerr point-particle Teukolsky solver"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.11", "tqdm>=4.66", "kerr-waveform-tools>=0.1.0"]

[tool.pytest.ini_options]
pythonpath = ["src", "../kerr_waveform_tools/src"]
testpaths = ["tests"]
